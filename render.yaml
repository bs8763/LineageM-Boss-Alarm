services:
  - type: web
    name: lineagem-boss-alarm
    runtime: node
    plan: free
    buildCommand: npm ci --ignore-scripts
    startCommand: npm start
    healthCheckPath: /readyz
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        sync: false
      - key: CLAN_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_CHANNEL_ID
        sync: false
      - key: REGISTER_DISCORD_COMMANDS
        value: 'false'
