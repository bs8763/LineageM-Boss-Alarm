plugins { id 'com.android.application' }
def configuredUrl = providers.environmentVariable('BOSS_APP_URL').getOrElse('https://ami37pk16s.apps.bot-hosting.cloud')
// Never publish an unsigned APK under a release filename. Debug builds remain usable
// without secrets; release builds require the complete signing configuration.
def releaseRequested = gradle.startParameter.taskNames.any { task ->
    task.toLowerCase(java.util.Locale.ROOT).matches('.*(assemblerelease|bundlerelease|publishrelease).*')
}
def signingNames = ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
if (releaseRequested) {
    def missing = signingNames.findAll { !providers.environmentVariable(it).orNull }
    if (!missing.isEmpty()) {
        throw new GradleException('Signed release requires: ' + missing.join(', '))
    }
    def keystore = file(providers.environmentVariable('ANDROID_KEYSTORE_PATH').get())
    if (!keystore.isFile()) {
        throw new GradleException('Release keystore file not found: ' + keystore)
    }
}
if (configuredUrl && !(configuredUrl ==~ /https:\/\/[a-zA-Z0-9.-]+(?::[0-9]+)?/)) { throw new GradleException('BOSS_APP_URL must be an HTTPS origin without path') }
android {
    signingConfigs {
        release {
            def storePath = providers.environmentVariable('ANDROID_KEYSTORE_PATH').orNull
            if (storePath) {
                storeFile file(storePath)
                storePassword providers.environmentVariable('ANDROID_KEYSTORE_PASSWORD').get()
                keyAlias providers.environmentVariable('ANDROID_KEY_ALIAS').get()
                keyPassword providers.environmentVariable('ANDROID_KEY_PASSWORD').get()
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    namespace 'com.bs8763.bossalarm'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bs8763.bossalarm'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '3.0.0-native'
        buildConfigField 'String', 'APP_URL', '"' + configuredUrl + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
