plugins { id 'com.android.application' }
def configuredUrl = providers.environmentVariable('BOSS_APP_URL').getOrElse('')
if (!(configuredUrl ==~ /https:\/\/[a-zA-Z0-9.-]+(?::[0-9]+)?/)) { throw new GradleException('BOSS_APP_URL must be configured to a reachable HTTPS origin without path; refusing to build with the suspended Render fallback') }
android {
    signingConfigs {
        release {
            def storePath = providers.environmentVariable('ANDROID_KEYSTORE_PATH').orNull
            if (storePath) {
                storeFile file(storePath)
                storePassword providers.environmentVariable('ANDROID_KEYSTORE_PASSWORD').get()
                keyAlias providers.environmentVariable('ANDROID_KEY_ALIAS').get()
                keyPassword providers.environmentVariable('ANDROID_KEY_PASSWORD').get()
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    namespace 'com.bs8763.bossalarm'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bs8763.bossalarm'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '3.0.0-native'
        buildConfigField 'String', 'APP_URL', '"' + configuredUrl + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
