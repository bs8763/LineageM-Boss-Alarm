plugins { id 'com.android.application' }
def configuredUrl = providers.environmentVariable('BOSS_APP_URL').getOrElse('https://lineagem-boss-alarm.onrender.com')
if (!(configuredUrl ==~ /https:\/\/[a-zA-Z0-9.-]+(?::[0-9]+)?/)) { throw new GradleException('BOSS_APP_URL must be an HTTPS origin without path') }
android {
    namespace 'com.bs8763.bossalarm'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bs8763.bossalarm'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '2.0.2'
        buildConfigField 'String', 'APP_URL', '"' + configuredUrl + '"'
    }
    buildFeatures { buildConfig true }
    buildTypes { release { debuggable false; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
