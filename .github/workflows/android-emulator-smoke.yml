name: Android Emulator Smoke Test
on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/android-emulator-smoke.yml'
      - 'build.gradle'
      - 'settings.gradle'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build and launch on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -e
            gradle --no-daemon :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.bs8763.bossalarm/.MainActivity | tee launch-result.txt
            sleep 20
            adb shell pidof com.bs8763.bossalarm | tee app-pid.txt
            adb shell dumpsys activity activities > activities.txt
            adb logcat -d -b crash > crash-log.txt
            adb logcat -d -v time > device-log.txt
            adb shell screencap -p /sdcard/boss-smoke.png
            adb pull /sdcard/boss-smoke.png boss-smoke.png
            test -s app-pid.txt
            if grep -Eq 'FATAL EXCEPTION|Process: com.bs8763.bossalarm' crash-log.txt; then
              echo "Crash log indicates app failure"
              exit 1
            fi
      - name: Upload diagnostics (no secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-smoke-diagnostics
          path: |
            launch-result.txt
            app-pid.txt
            activities.txt
            crash-log.txt
            device-log.txt
            boss-smoke.png
          if-no-files-found: ignore
          retention-days: 7
