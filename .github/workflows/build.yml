name: Verify and Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: bosses
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:ci
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only@localhost:5432/bosses
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release, lint and test origin restrictions
        run: gradle --no-daemon :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease :app:dependencies --configuration releaseRuntimeClasspath
        env:
          BOSS_APP_URL: ${{ vars.BOSS_APP_URL || 'https://lineagem-boss-alarm.onrender.com' }}
      - name: Focused APK security gate and signing tools
        run: |
          mkdir -p security-artifact/tools
          cp app/build/outputs/apk/release/app-release-unsigned.apk security-artifact/
          python3 scripts/audit_apk.py security-artifact/app-release-unsigned.apk --aapt "$ANDROID_HOME/build-tools/34.0.0/aapt" --release > security-artifact/security-audit.json
          cp "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar" security-artifact/tools/
          cp "$ANDROID_HOME/build-tools/34.0.0/aapt" security-artifact/tools/
          cp app/build/reports/lint-results-release.* security-artifact/
          cp -r app/build/test-results/testReleaseUnitTest security-artifact/
          sha256sum security-artifact/app-release-unsigned.apk security-artifact/tools/* > security-artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LineageM-Boss-Alarm-security-unsigned-${{ github.sha }}
          path: security-artifact/
          if-no-files-found: error
          retention-days: 14

