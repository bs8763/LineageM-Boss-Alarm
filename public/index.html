<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="/boss-icon.svg"><title>리니지M 혈맹 보스탐</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><p class="eyebrow">LINEAGE M · CLAN BOARD</p><h1>⚔ 혈맹 보스탐</h1><p>앱과 디스코드가 함께 쓰는 보스 현황판 · 한국시간</p></header>
<section id="login"><h2>혈맹 접속</h2><label>접속 키<input id="token" type="password" autocomplete="off" placeholder="혈맹 키 또는 관리자 키"></label><button id="connect">접속하기</button><p>키는 이 창을 닫으면 지워집니다.</p></section>
<p id="status" role="status" aria-live="polite">접속 키를 입력하세요.</p>
<div id="board" hidden><nav><input id="search" placeholder="보스 이름·맵 검색" aria-label="보스 검색"><button id="refresh">새로고침</button><button id="logout" class="secondary">로그아웃</button></nav><p class="hint">컷: 입력한 처치 시각부터 다음 리젠 · 멍: 예정 시각에서 다음 주기로 이동<br>30분 미확인 시 자동 멍 처리. 절전 중 기록은 재접속 때 계산합니다.</p><div id="summary"></div><div class="filters" aria-label="보스 상태별 보기"><button id="filterAll" class="filter-button selected" type="button">전체</button><button id="filterReady" class="filter-button" type="button">출현 확인</button><button id="filterSoon" class="filter-button" type="button">1시간 이내</button><button id="filterUnscheduled" class="filter-button" type="button">미등록</button></div><div id="list"></div>
<section><h2>최근 기록</h2><div id="history"></div></section>
<section id="admin" hidden><h2>관리자 · 백업과 복구</h2><p>설정·초기화·복구 전에 서버에 자동 백업합니다.</p><button id="backup">현재 백업 다운로드</button><label>백업 파일 복원<input id="restoreFile" type="file" accept="application/json,.json"></label><button id="restore" class="secondary">선택한 파일 복원</button><button id="backups" class="secondary">자동 백업 목록</button><div id="backupList"></div><button id="reset" class="danger">전체 시간·멍 초기화</button></section></div>
<footer>기본 보스표는 참고용입니다. 맵·리젠은 혈맹 관리자 확인 후 사용하세요.</footer></main></body></html>
