<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리니지M 보스탐</title><style>body{font-family:system-ui;background:#101827;color:#fff;margin:0;padding:22px}main{max-width:550px;margin:auto}h1{font-size:25px}section{background:#202c40;border-radius:16px;padding:18px;margin:20px 0}input,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:9px;border:0;font-size:16px}button{background:#6676ff;color:white;font-weight:700}.boss{padding:12px;border-bottom:1px solid #475569}.muted{color:#b4c3da;font-size:14px}.delete{background:#39465b;width:auto;padding:6px 12px;float:right}</style></head><body><main><h1>⚔️ 리니지M 보스탐</h1><p class="muted">앱과 디스코드 슬래시 명령어가 같은 보스 목록을 사용합니다.</p><section><h2>보스 등록 / 수정</h2><input id="name" placeholder="보스 이름"><input id="time" type="datetime-local"><button onclick="add()">등록하기</button><p id="status" class="muted"></p></section><section><h2>출현 예정</h2><div id="list">불러오는 중...</div></section></main><script>const $=id=>document.getElementById(id);async function load(){try{const r=await fetch('/api/bosses');const bs=await r.json();$('list').replaceChildren();if(!bs.length){$('list').textContent='등록된 보스가 없습니다.';return}for(const b of bs){const d=document.createElement('div');d.className='boss';const btn=document.createElement('button');btn.className='delete';btn.textContent='삭제';btn.onclick=async()=>{await fetch('/api/bosses/'+encodeURIComponent(b.name),{method:'DELETE'});load()};const title=document.createElement('strong');title.textContent=b.name;const desc=document.createElement('p');desc.className='muted';desc.textContent=new Date(b.time).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'});d.append(btn,title,desc);$('list').append(d)}}catch{$('list').textContent='서버 연결 실패'}}async function add(){const name=$('name').value.trim(),time=$('time').value;if(!name||!time)return $('status').textContent='이름과 시간을 입력해 주세요';const r=await fetch('/api/bosses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,time:new Date(time).toISOString()})});$('status').textContent=r.ok?'등록 완료':'등록 실패';load()}load();setInterval(load,30000)</script></body></html>
